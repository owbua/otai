# Veröffentlicht automatisch ein Release, sobald auf main eine neue versionName steht
# (app/build.gradle.kts), für die es noch kein Release gibt – Tag inklusive. Alternativ startet
# ein selbst gesetzter Tag vX.Y.Z denselben Ablauf. Obtainium beobachtet diese Releases.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version ermitteln
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip == 'false'

      - name: Android-SDK ergänzen
        if: steps.version.outputs.skip == 'false'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null || true

      - name: Signaturschlüssel bereitstellen
        if: steps.version.outputs.skip == 'false'
        env:
          OTAI_KEYSTORE_BASE64: ${{ secrets.OTAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OTAI_KEYSTORE_BASE64" ]; then
            echo "::error::Secret OTAI_KEYSTORE_BASE64 fehlt – ohne den Release-Schlüssel ließe sich die APK nicht als Update installieren."
            exit 1
          fi
          echo "$OTAI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otai-release.p12"

      - name: Tests
        if: steps.version.outputs.skip == 'false'
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release-APK bauen
        if: steps.version.outputs.skip == 'false'
        env:
          OTAI_KEYSTORE: ${{ runner.temp }}/otai-release.p12
          OTAI_KEYSTORE_PASSWORD: ${{ secrets.OTAI_KEYSTORE_PASSWORD }}
          OTAI_KEY_ALIAS: otai
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Signatur prüfen
        if: steps.version.outputs.skip == 'false'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signatur.txt
          grep -q "CN=otai" signatur.txt

      - name: Release veröffentlichen
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "otai-${TAG}.apk"
          gh release create "$TAG" "otai-${TAG}.apk" --target "$GITHUB_SHA" \
            --title "otai ${TAG#v}" --generate-notes

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/otai-release.p12"

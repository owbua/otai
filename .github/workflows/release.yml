# Baut bei jedem Versions-Tag (z. B. v1.6.0) die signierte APK und veröffentlicht sie als Release.
# Obtainium beobachtet diese Releases und bietet Updates an.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android-SDK ergänzen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null || true

      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Signaturschlüssel bereitstellen
        env:
          OTAI_KEYSTORE_BASE64: ${{ secrets.OTAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OTAI_KEYSTORE_BASE64" ]; then
            echo "::error::Secret OTAI_KEYSTORE_BASE64 fehlt – ohne den Release-Schlüssel ließe sich die APK nicht als Update installieren."
            exit 1
          fi
          echo "$OTAI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/otai-release.p12"

      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release-APK bauen
        env:
          OTAI_KEYSTORE: ${{ runner.temp }}/otai-release.p12
          OTAI_KEYSTORE_PASSWORD: ${{ secrets.OTAI_KEYSTORE_PASSWORD }}
          OTAI_KEY_ALIAS: otai
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signatur.txt
          grep -q "CN=otai" signatur.txt

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "otai-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "otai-${GITHUB_REF_NAME}.apk" \
            --title "otai ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/otai-release.p12"
